<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="style.css">
        <title>CS2 Demo Analyzer</title>
    </head>
    <body>
        <div class="container">
            <div>
                <h1>CS2 Demo Analyzer</h1>
            </div>
            <div id="matchData">
                <img class="bgimg" src="assets/background/Screenshot 2026-11-04 112440.png" alt="mapBackground">
                <h3>Match Data</h3>
                <h3 id="mapData"></h3> 
                <h3 id="score">Score </h3>
            </div>
            <div class="radar" id="heatmap">
                <h3 id="h3hm">Heatmap</h3>
                <fieldset id="heatmap-switcher">
                    <label class="switch">
                        <input id="kill" type="radio" name="hm" value="killer" checked>
                        <span>Kills</span>
                    </label>
                    <label class="switch">
                        <input id="death" type="radio" name="hm" value="victim">
                        <span>Deaths</span>
                    </label>
                    <label class="switch">
                        <input id="hit" type="radio" name="hm" value="hitin">
                        <span>Hits</span>
                    </label>
                    <label class="switch">
                        <input id="hurt" type="radio" name="hm" value="hurtin">
                        <span>Hurts</span>
                    </label>
                </fieldset>
                <select class="combobox" name="players" id="hmcombobox">
                    <option value="default">All Players</option>
                </select>
                <div id="HC">
                    <img id="radar" alt="Radarbild der Map">
                </div>
            </div>
            <div id="killfeed">
                <h3>Killfeed</h3>
            </div>
            <div class="footer">
                <fieldset id="chart-switcher">
                    <label class="switch">
                        <input id="chart-ct-start" type="radio" name="cs" value="CT" checked>
                        <span>CT</span>
                    </label>
                    <label class="switch">
                        <input id="chart-t-start" type="radio" name="cs" value="T">
                        <span>T</span>
                    </label>
                </fieldset>
                <select class="combobox" name="players" id="chartcombobox">
                    <option value="default">All Players</option>
                </select>
                <canvas id="chart"></canvas>
            </div>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/heatmap.js/2.0.2/heatmap.min.js"></script>
        <script src="script.js"></script>
    </body>
</html>
